name: Deploy Salary System to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare local browser SDKs
        run: |
          curl -fsSL https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js -o supabase.min.js
          test -s supabase.min.js

      - name: Validate app JavaScript
        run: |
          python3 - <<'PY'
          import re, pathlib
          html=pathlib.Path("app.html").read_text(encoding="utf-8")
          blocks=re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S|re.I)
          for i,code in enumerate(blocks,1):
              pathlib.Path(f"/tmp/app-script-{i}.js").write_text(code,encoding="utf-8")
          print(f"Found {len(blocks)} inline script blocks")
          PY
          : > /tmp/syntax-errors.txt
          failed=0
          for f in /tmp/app-script-*.js; do
            if ! node --check "$f" >> /tmp/syntax-errors.txt 2>&1; then
              echo "SYNTAX ERROR IN $f" >> /tmp/syntax-errors.txt
              failed=1
            fi
          done
          cat /tmp/syntax-errors.txt
          exit $failed

      - name: Upload JavaScript validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javascript-validation-report
          path: /tmp/syntax-errors.txt
          if-no-files-found: ignore

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
