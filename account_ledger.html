<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Office Account Ledger — Harshi Computer</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Devanagari",sans-serif;background:#f3f6fa;color:#172033}
.top{background:#123b73;color:#fff;padding:15px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.top h1{margin:0;font-size:20px}.wrap{max-width:1400px;margin:20px auto;padding:0 16px}
.card{background:#fff;border:1px solid #dce4ef;border-radius:12px;padding:18px;margin-bottom:14px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.btn{border:1px solid #d7dfeb;background:#fff;padding:9px 13px;border-radius:8px;cursor:pointer}.primary{background:#1857a8;color:#fff;border-color:#1857a8}
.notice{padding:10px;border-radius:8px;background:#fff7ed;border:1px solid #fed7aa;color:#8a4b08}
.ok{color:#16803c}.error{color:#b42318}.muted{color:#667085;font-size:13px}
table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:10px;border-bottom:1px solid #edf1f6;text-align:left;font-size:14px;white-space:nowrap}th{background:#f7f9fc}
input{padding:10px;border:1px solid #dce4ef;border-radius:8px;background:#fff;width:100%}
.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.formgrid label{font-weight:bold}.formgrid input{margin-top:5px}
.scroll{overflow:auto}@media(max-width:700px){.formgrid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.top h1{font-size:17px}}
</style></head><body>
<header class="top"><h1>🏦 Harshi Computer — Office Account Ledger</h1><div class="toolbar">
<button class="btn" onclick="goBack()">← Summary</button><button class="btn" onclick="signOut()">Logout</button></div></header>
<main class="wrap">
<div class="card"><h2 id="title">Ledger</h2><p id="sub" class="muted"></p><div id="top" class="notice"></div></div>
<div id="form" class="card" style="display:none;background:#f8fafc"><h3 id="formTitle">Ledger Entry</h3>
<div class="formgrid"><input id="id" type="hidden">
<label>Date<input id="date" type="date"></label>
<label>Voucher<input id="voucher" placeholder="Voucher No."></label>
<label>विवरण<input id="description" placeholder="आय / व्यय से संबंधित विवरण"></label>
<label>आय / Receipt ₹<input id="receipt" type="number" min="0" step="0.01"></label>
<label>व्यय / Payment ₹<input id="payment" type="number" min="0" step="0.01"></label></div>
<div class="toolbar" style="margin-top:12px"><button class="btn primary" onclick="saveEntry()">💾 Save Entry</button><button class="btn" onclick="cancelForm()">Cancel</button></div><p id="msg" class="muted"></p></div>
<div class="card"><div class="toolbar" style="justify-content:space-between"><h3>📒 Detailed Ledger</h3><button class="btn primary" onclick="newEntry()">+ नई Entry</button></div>
<div id="table" class="scroll"></div></div>
</main>
<script>
const URL="https://khwzoolgjzghdixlclwu.supabase.co",KEY="sb_publishable_ooB9J-BxQ11AFzYURjthcw_G90Zyb6P";const db=window.supabase.createClient(URL,KEY);
const p=new URLSearchParams(location.search),head=p.get("head")||"",fy=p.get("fy")||"2025-26";let rows=[],timer;
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
const date=v=>{if(!v)return"—";const m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[3]+"-"+m[2]+"-"+m[1]:v};
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
async function init(){const s=await db.auth.getSession();if(!s.data.session){location.href="app.html";return}document.getElementById("title").textContent="📒 Ledger — "+head;document.getElementById("sub").textContent="वित्तीय वर्ष: "+fy+" | इस पूरे पेज से Ledger को आगे बढ़ाया और Edit किया जा सकता है।";await load()}
async function load(){const q=await db.from("account_transactions").select("*").eq("financial_year",fy).eq("head_name",head).order("transaction_date",{ascending:true,nullsFirst:true}).order("source_row");if(q.error){document.getElementById("table").innerHTML="<p class=error>"+esc(q.error.message)+"</p>";return}rows=q.data||[];const h=await db.from("account_heads").select("*").eq("financial_year",fy).eq("head_name",head).maybeSingle();const opening=Number(h.data?.opening_balance||0);let bal=opening;document.getElementById("top").innerHTML="Opening Balance: <b>"+money(opening)+"</b> &nbsp; | &nbsp; Entries: <b>"+rows.length+"</b>";let html="<table><thead><tr><th>Date</th><th>Voucher</th><th>विवरण</th><th>Receipt / आय</th><th>Payment / व्यय</th><th>Balance</th><th>Action</th></tr></thead><tbody>";rows.forEach(x=>{bal+=Number(x.receipt_amount||0)-Number(x.payment_amount||0);html+="<tr><td>"+date(x.transaction_date)+"</td><td>"+esc(x.voucher_no||"—")+"</td><td>"+esc(x.description||"")+"</td><td>"+money(x.receipt_amount)+"</td><td>"+money(x.payment_amount)+"</td><td><b>"+money(bal)+"</b></td><td><button class=btn onclick=\"editEntry('"+x.id+"')\">Edit</button> <button class=btn onclick=\"deleteEntry('"+x.id+"')\">Delete</button></td></tr>"});html+="</tbody></table><p><b>Closing Balance: "+money(bal)+"</b></p>";if(!rows.length)html+="<div class=notice>इस Head में अभी कोई detailed Entry नहीं है। + नई Entry से शुरुआत करें।</div>";document.getElementById("table").innerHTML=html}
function newEntry(){document.getElementById("form").style.display="block";document.getElementById("formTitle").textContent="➕ नई Ledger Entry";document.getElementById("id").value="";document.getElementById("date").value=new Date().toISOString().slice(0,10);document.getElementById("voucher").value="";document.getElementById("description").value="";document.getElementById("receipt").value="";document.getElementById("payment").value="";document.getElementById("msg").textContent=""}
async function editEntry(id){const x=rows.find(r=>r.id===id);if(!x)return;newEntry();document.getElementById("formTitle").textContent="✏️ Ledger Entry Edit करें";document.getElementById("id").value=x.id;document.getElementById("date").value=x.transaction_date||"";document.getElementById("voucher").value=x.voucher_no||"";document.getElementById("description").value=x.description||"";document.getElementById("receipt").value=x.receipt_amount??"";document.getElementById("payment").value=x.payment_amount??"";window.scrollTo({top:0,behavior:"smooth"})}
function cancelForm(){document.getElementById("form").style.display="none"}
async function saveEntry(){const u=(await db.auth.getUser()).data.user;if(!u){location.href="app.html";return}const id=document.getElementById("id").value,datev=document.getElementById("date").value,v=document.getElementById("voucher").value.trim()||null,d=document.getElementById("description").value.trim()||null,r=Number(document.getElementById("receipt").value||0),pay=Number(document.getElementById("payment").value||0),msg=document.getElementById("msg");if(!datev){msg.textContent="Date आवश्यक है।";msg.className="error";return}if(r<0||pay<0||r===0&&pay===0||r>0&&pay>0){msg.textContent="एक Entry में केवल आय या व्यय की राशि रखें।";msg.className="error";return}msg.textContent="सेव हो रहा है...";let payload={financial_year:fy,head_name:head,transaction_date:datev,voucher_no:v,description:d,receipt_amount:r,payment_amount:pay};let q=id?await db.from("account_transactions").update(payload).eq("id",id):await db.from("account_transactions").insert({...payload,user_id:u.id,source_sheet:"Manual Ledger",source_row:null});if(q.error){msg.textContent=q.error.message;msg.className="error";return}await updateSummary();msg.textContent="✅ Entry सुरक्षित हो गई।";msg.className="ok";cancelForm();await load()}
async function updateSummary(){const h=await db.from("account_heads").select("opening_balance").eq("financial_year",fy).eq("head_name",head).maybeSingle();const opening=Number(h.data?.opening_balance||0);const q=await db.from("account_transactions").select("receipt_amount,payment_amount").eq("financial_year",fy).eq("head_name",head);const tr=(q.data||[]).reduce((s,x)=>s+Number(x.receipt_amount||0),0),tp=(q.data||[]).reduce((s,x)=>s+Number(x.payment_amount||0),0);await db.from("account_heads").update({total_receipts:tr,total_payments:tp,closing_balance:opening+tr-tp}).eq("financial_year",fy).eq("head_name",head)}
async function deleteEntry(id){if(!confirm("क्या यह Ledger Entry delete करनी है?"))return;const q=await db.from("account_transactions").delete().eq("id",id);if(q.error){alert(q.error.message);return}await updateSummary();await load()}
function goBack(){location.href="app.html?open=officeAccount"}async function signOut(){await db.auth.signOut();location.href="app.html"}timer=setTimeout(()=>{db.auth.signOut();location.href="index.html"},600000);init();
</script></body></html>
